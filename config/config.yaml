# RSS-ленты (базовый бесплатный поток новостей)
feeds:
  - name: Interfax
    url: "https://www.interfax.ru/rss.asp"
  - name: RBC
    url: "https://rsstor.rbc.ru/rbc/news"
  - name: Prime
    url: "https://1prime.ru/rss"
  - name: Vedomosti
    url: "https://www.vedomosti.ru/rss/news"
  - name: Kommersant
    url: "https://www.kommersant.ru/RSS/news.xml"

# Exa — семантический поиск новостей (если EXA_API_KEY задан в .env).
exa_queries:
  - "российский фондовый рынок новости"
  - "санкции против России новости"
  - "нефть газ цены новости"

# Расписания. Время брифингов — в зоне владельца (tz), торговое окно — по МСК.
schedule:
  tz: "Asia/Vladivostok"       # зона владельца (Владивосток, UTC+10)
  tz_label: "ВЛТ"
  quotes_interval_min: 10      # опрос котировок MOEX ISS
  scan_interval_min: 5         # интрадей-сканер пула внимания
  news_interval_min: 20        # опрос RSS + Exa
  # Рассылки в Telegram: владельцу нужен один экран по запросу, а не лента.
  # Всё считается и пишется в базу; в чат уходит только то, что включено ниже.
  brief_time: "09:00"          # утренний брифинг (= 02:00 МСК, до открытия MOEX)
  evening_time: "22:00"        # итоги дня (= 15:00 МСК, к концу сессии)
  send_brief: false            # НЕ слать утренний брифинг в чат
  send_evening: false          # НЕ слать вечерний итог в чат
  send_intraday_alerts: false  # НЕ слать интрадей-события («тест уровня» и пр.)
  send_paper_events: false     # НЕ слать каждый бумажный вход/выход
  morning_start: "06:50"       # утренняя сессия MOEX (будни), по МСК
  session_start: "09:50"       # основная сессия MOEX, по МСК
  session_end: "18:50"         # конец основной сессии, по МСК
  evening_start: "19:00"       # вечерняя сессия MOEX (будни), по МСК
  evening_end: "23:50"         # конец вечерней сессии, по МСК

# Правила алертов
alerts:
  impact_threshold: 3          # слать алерт при важности >= 3 (важные события)
  max_per_hour: 5              # антиспам: максимум алертов в час
  llm_comment: false           # true = короткий LLM-комментарий к алерту (тратит токены)

# LLM
llm:
  max_tokens: 4500
  temperature: 0.2
  news_hours: 48               # глубина новостей для анализа
  max_news_per_ticker: 6       # сколько новостей на тикер в промпт
  batch_size: 8                # тикеров на один LLM-запрос (весь watchlist батчами)

# Интрадей-сканер волатильности (10-минутные свечи, пул внимания)
intraday:
  interval: 10                 # размер свечи, минут
  spike_pct: 1.2               # "резкий скачок": движение % за 15-30 мин
  vol_mult: 2.0                # объём импульса x от среднего
  rsi_low: 25                  # интрадей RSI: перепроданность
  rsi_high: 75                 # интрадей RSI: перекупленность
  cooldown_min: 30             # антиспам: пауза между одинаковыми алертами по бумаге
  max_per_day: 12              # антиспам: максимум интрадей-алертов в день на весь пул
  levels_tolerance_pct: 0.2    # допуск кластеризации S/R уровней, %
  profile_buckets: 30          # корзин многодневного Volume Profile (POC/VAH/VAL)
  va_pct: 0.70                 # доля объёма зоны стоимости (Value Area), 0..1
  # Фактический тариф владельца (с 2026-11): 0.15% ВХОД+ВЫХОД вместе.
  # slip_pct — проскальзывание на одну сторону; считается дважды (вход и выход).
  # Итог на сделку = fee_pct + 2*slip_pct, его печатает бэктест и вердикт.
  fee_pct: 0.15                # комиссия round-trip, % от цены
  slip_pct: 0.05               # проскальзывание на сторону, %
  min_net_pct: 1.0             # минимальная чистая прибыль после издержек для входа, %
  min_rr: 1.2                  # минимальное чистое R/R после издержек
  # Пороги скоринга (балл сетапа)
  enter_score: 5.0             # с какого балла рекомендовать вход (калибровано на train)
  wait_score: 2.5              # ниже — «не входить»
  confluence_cap: 1.5          # потолок балла, если подтверждений меньше min_confirmations
  # Веса компонентов скоринга. Пусто = значения по умолчанию из кода
  # (DEFAULT_WEIGHTS в pipelines/intraday.py).
  # ВАЖНО: заданный score_weights — ПОЛНЫЙ набор, отсутствующие компоненты = 0.
  score_weights:
    trend_up: 1.5
    trend_down: -1.5
    supertrend_up: 0.5
    supertrend_down: -0.5
    adx_flat: 0.5
    vwap_above: 0.5
    vwap_below: -0.5
    rsi_overbought: 1.0
    rsi_oversold: -0.5
    rng_upper: 0.5
    vol_low: -0.5
    profile_above: 0.5
    profile_below: -0.5
    obv_bull: 0.5
    div_daily_bull: 1.0
    div_intraday_bull: -1.0
    div_intraday_bear: 1.0
    level_resistance: 0.5
  # Фильтр ликвидности: минимальный средний дневной оборот бумаги, ₽ (0 = выключен).
  min_turnover_rub: 50000000   # 50 млн ₽/день: тонкие бумаги отсекаются
  # --- Управление открытой позицией (0 = выключено) ---
  exit_be_atr: 0               # безубыток после хода на N ATR в плюс
  exit_trail_atr: 0            # трейлинг на N ATR ниже максимума
  # --- Риск-слой бумажной торговли ---
  max_per_sector: 2            # не больше N открытых позиций из одной группы
  kill_switch_dd_pct: 15.0     # просадка капитала, после которой новые входы стоп
  # --- Горизонт владельца: свинг (неделя-две) либо пересиживание ---
  # swing — стоп 1.5 дневных ATR, цель 3 ATR; hold — стоп 2.5 ATR, цель 4 ATR.
  horizon: swing               # swing | hold
  stop_atr_swing: 1.5          # стоп в дневных ATR для свинга
  target_atr_swing: 3.0        # цель в дневных ATR для свинга
  stop_atr_hold: 2.5           # стоп в дневных ATR для пересиживания
  target_atr_hold: 4.0         # цель в дневных ATR для пересиживания
  target_atr: 2.0              # множитель ATR для цели (свинг 3-4 дня)
  paper_trading: true          # бумажная торговля: бот сам входит/выходит и ведёт статистику
  paper_interval_min: 60       # свинг: ищем входы раз в час, а не каждые 10 мин
  paper_top_n: 5               # во сколько лучших бумаг по баллу входить (весь watchlist)
  paper_max_open: 5            # максимум одновременно открытых бумажных позиций
  paper_max_new_per_day: 2     # максимум НОВЫХ входов в день (разнос по режимам рынка)
  paper_exit_days: 5           # выход по времени: 5 торговых дней (политика time5 — лучшая по бэктесту)
  paper_cooldown_hours: 24     # пауза повторного входа после стопа, часов
  poscheck_interval_min: 15    # свинг: цель/стоп на дневках — проверки раз в 15 мин хватает
  history_days: 5              # календарных дней 10-мин свечей (запас на выходные)
  min_confirmations: 2         # минимум независимых подтверждений для вердикта enter
  # --- Кандидаты на глубокий разбор TradingAgents (раз в день после вечернего итога) ---
  deep_candidates_enabled: true  # слать в Telegram список «прогони по ним разбор»
  deep_candidates_top_n: 3       # сколько бумаг предлагать
  # --- Короткие пинги «стоит глянуть» (владелец торгует сам на бирже) ---
  setup_pings_enabled: true      # слать 1-строчные пинги по сильным сетапам
  setup_ping_score: 2.0          # балл, с которого сетап считается «сильным» (помимо enter)
  setup_ping_interval_min: 30    # как часто проверять новые сильные сетапы, минут
  setup_ping_max: 3              # максимум бумаг в одном пинге (не простыня)
