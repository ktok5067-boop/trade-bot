# ============================================================
# Конфигурация торгового агента
# Секреты (токены, ключи) — НЕ здесь, а в .env / HF Secrets
# ============================================================

# Дисклеймер «не ИИР» в отчётах (для личного использования отключён)
show_disclaimer: false

# Метка сборки: видна в health-ответе (/), чтобы снаружи убедиться,
# что Render поднял именно эту версию кода и конфига.
build_id: "2026-11-27-calib2"

# Запасной путь без проверки сертификата ТОЛЬКО для iss.moex.com (публичные
# котировки, без ключей). Включено, потому что с Render цепочка сертификатов
# MOEX не проходит проверку: бот оставался без данных и не входил в бумагу.
# Когда цепочка начнёт проходить — выключить (false).
moex_insecure_tls: true

# Группы для ограничения концентрации: одна ставка на группу, а не пять.
sectors:
  banks: [SBER, VTBR, T, CBOM, MOEX]
  oil_gas: [GAZP, LKOH, ROSN, SNGS, TATN, NVTK, TRNFP]
  metals: [GMKN, CHMF, NLMK, MAGN, RUAL, ALRS, PLZL]
  retail: [MGNT, X5, OZON]
  telecom: [MTSS]
  transport: [AFLT]
  power: [HYDR, FEES, IRAO]
  chemicals: [PHOR]
  it: [YDEX]
  other: [SPBE, AFKS, PIKK]

